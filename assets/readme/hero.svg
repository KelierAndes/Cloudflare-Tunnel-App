<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">Cloudflare Tunnel Manager</title>
  <desc id="d">Hero banner: name and bilingual tagline on the left; on the right a tunnel scene — traffic dots flow from a laptop through a tunnel tube into a Cloudflare cloud, above a scrolling log strip.</desc>

  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#16213E" stroke-width="1"/>
    </pattern>
    <clipPath id="logclip"><rect x="24" y="212" width="412" height="52"/></clipPath>
  </defs>

  <rect width="1200" height="360" rx="26" fill="#0B1020"/>
  <rect width="1200" height="360" rx="26" fill="url(#grid)" opacity="0.55"/>

  <!-- title block -->
  <g transform="translate(64 52)">
    <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" letter-spacing="3" fill="#F6821F">VISUAL CLOUDFLARED MANAGER</text>
    <text y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="60" font-weight="700" fill="#E8ECF8">Tunnel Manager</text>

    <path d="M2 102 h30 l12 -16 12 32 12 -32 12 16 h30" fill="none" stroke="#F6821F" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>

    <text y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" fill="#C3CEE8">Named tunnels, port mappings, DNS</text>
    <text y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" fill="#C3CEE8">CNAMEs and live logs in one app.</text>
    <text y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#8FA0C8">&#25226; cloudflared &#30340;&#38567;&#36947;&#12289;&#26144;&#23556;&#19982;&#26085;&#24535;&#25910;&#36827;&#19968;&#20010;&#30028;&#38754;</text>

    <g transform="translate(0 240)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#9FB0D8">
      <rect width="150" height="34" rx="8" fill="none" stroke="#2A3A60"/><text x="16" y="23">Dart &#183; Flutter</text>
      <g transform="translate(164 0)"><rect width="130" height="34" rx="8" fill="none" stroke="#2A3A60"/><text x="16" y="23">Windows</text></g>
      <g transform="translate(308 0)"><rect width="120" height="34" rx="8" fill="none" stroke="#2A3A60"/><text x="16" y="23">Android</text></g>
      <g transform="translate(442 0)"><rect width="100" height="34" rx="8" fill="none" stroke="#2A3A60"/><text x="16" y="23">Linux</text></g>
    </g>
  </g>

  <!-- tunnel scene -->
  <g transform="translate(676 40)">
    <rect width="460" height="280" rx="18" fill="#070C1C" stroke="#223258" stroke-width="1.5"/>

    <!-- laptop -->
    <g transform="translate(40 104)">
      <rect width="64" height="44" rx="6" fill="none" stroke="#4EF7C8" stroke-width="2"/>
      <line x1="52" y1="32" x2="52" y2="32" stroke="#4EF7C8" stroke-width="2"/>
      <path d="M-6 50 H70" stroke="#4EF7C8" stroke-width="2" stroke-linecap="round"/>
      <text x="32" y="72" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#9FB0D8">localhost</text>
    </g>

    <!-- tunnel tube -->
    <g transform="translate(130 108)">
      <rect width="180" height="36" rx="18" fill="none" stroke="#F6821F" stroke-width="2"/>
      <circle r="4" cx="14" cy="18" fill="#4EF7C8"><animateMotion path="M0 0 L152 0" dur="1.4s" repeatCount="indefinite"/></circle>
      <circle r="4" cx="14" cy="18" fill="#F6821F"><animateMotion path="M0 0 L152 0" dur="1.4s" begin="0.45s" repeatCount="indefinite"/></circle>
      <circle r="4" cx="14" cy="18" fill="#8B7BE8"><animateMotion path="M0 0 L152 0" dur="1.4s" begin="0.9s" repeatCount="indefinite"/></circle>
    </g>

    <!-- cloud -->
    <g transform="translate(340 100)">
      <path d="M14 44 a16 16 0 1 1 6 -31 a20 20 0 1 1 38 4 a14 14 0 1 1 8 27 z" fill="none" stroke="#F6821F" stroke-width="2.5"/>
      <text y="64" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#9FB0D8">edge</text>
    </g>

    <!-- route label -->
    <text x="230" y="86" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#5B6C93">https://app.example.com &#8594; :8443</text>

    <!-- log strip -->
    <rect x="24" y="212" width="412" height="52" rx="8" fill="none" stroke="#1E2A4A"/>
    <g clip-path="url(#logclip)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#5B6C93">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -156" dur="7.5s" repeatCount="indefinite"/>
        <text x="40" y="232">&#8226; tunnel ready &#183; 2 routes</text>
        <text x="40" y="258">&#8226; cloudflared 2026.10.3 started</text>
        <text x="40" y="284">&#8226; CNAME created</text>
        <text x="40" y="388">&#8226; tunnel ready &#183; 2 routes</text>
        <text x="40" y="414">&#8226; cloudflared 2026.10.3 started</text>
        <text x="40" y="440">&#8226; CNAME created</text>
      </g>
    </g>
  </g>
</svg>
